[package]
name = "dsh-desktop-installer"
version = "0.1.0"
description = "DeepSeek Harness Setup"
authors = ["DeepSeek AI"]
license = "MIT"
edition = "2021"

[lib]
name = "dsh_desktop_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "5"
zip = "2"
mslnk = "0.1"
