<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f7f9;
        color: #17202a;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .mark {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: #1f6feb;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-weight: 700;
        font-size: 18px;
      }
      .status {
        font-size: 14px;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">dsh</div>
      <div class="status">Starting DeepSeek Harness...</div>
    </main>
  </body>
</html>
